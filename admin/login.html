<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 base-uri 'none';
                 object-src 'none';
                 frame-ancestors 'none';
                 form-action 'self';
                 script-src 'self' https://cdn.jsdelivr.net;
                 style-src 'self';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src 'self' https://*.supabase.co wss://*.supabase.co;
                 upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>m∞hae Admin Login</title>
  <link rel="stylesheet" href="../assets/css/admin-auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="loginTitle">
      <div class="auth-brand">
        <strong>m∞hae</strong>
        <span>ADMIN</span>
      </div>

      <div class="auth-copy">
        <p class="eyebrow">SECURE ADMIN ACCESS</p>
        <h1 id="loginTitle">관리자 로그인</h1>
        <p>인증된 무해 운영자만 접근할 수 있습니다.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <label for="email">
          <span>이메일</span>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="username"
            maxlength="254"
            required
            placeholder="관리자 이메일">
        </label>

        <label for="password">
          <span>비밀번호</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            maxlength="128"
            required
            placeholder="관리자 비밀번호">
        </label>

        <button id="loginButton" class="primary-button" type="submit">
          로그인
        </button>

        <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        <a href="../index.html">← moohae.me 돌아가기</a>
        <p>비밀번호와 Secret Key는 이 페이지에 저장되지 않습니다.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
</body>
</html>
