<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 base-uri 'none';
                 object-src 'none';
                 frame-ancestors 'none';
                 script-src 'self' https://cdn.jsdelivr.net;
                 style-src 'self';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src 'self' https://*.supabase.co wss://*.supabase.co;
                 upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>고객 상세 · m∞hae Admin</title>
  <link rel="stylesheet" href="../assets/css/admin-auth.css">
</head>
<body class="dashboard-page">
  <header class="admin-topbar">
    <a class="admin-logo" href="./dashboard.html">m∞hae <span>ADMIN</span></a>
    <div class="admin-topbar-actions">
      <span id="adminIdentity">확인 중...</span>
      <button id="logoutButton" class="secondary-button" type="button">로그아웃</button>
    </div>
  </header>

  <main class="dashboard-shell detail-shell">
    <a class="back-link" href="./dashboard.html">← 고객 목록</a>

    <section class="customer-detail-hero">
      <div>
        <p class="eyebrow">CUSTOMER PROFILE</p>
        <h1 id="customerName">고객 정보를 확인하고 있습니다.</h1>
        <p id="customerMeta" class="detail-meta">—</p>
      </div>
      <span id="customerStatus" class="status-badge neutral">확인 중</span>
    </section>

    <section class="detail-grid">
      <article class="detail-card">
        <div class="detail-card-head">
          <div>
            <p class="eyebrow">BASIC INFO</p>
            <h2>고객 기본정보</h2>
          </div>
        </div>
        <dl class="info-list">
          <div><dt>이름</dt><dd id="detailName">—</dd></div>
          <div><dt>연락처</dt><dd id="detailPhone">—</dd></div>
          <div><dt>상태</dt><dd id="detailStatus">—</dd></div>
          <div><dt>개인정보 동의</dt><dd id="detailConsent">—</dd></div>
          <div><dt>등록일</dt><dd id="detailCreatedAt">—</dd></div>
        </dl>
      </article>

      <article class="detail-card">
        <div class="detail-card-head">
          <div>
            <p class="eyebrow">LATEST DIAGNOSIS</p>
            <h2>최근 온라인 진단</h2>
          </div>
        </div>
        <div id="latestDiagnosis" class="timeline-block">
          <p class="muted-copy">진단 정보를 확인하고 있습니다.</p>
        </div>
      </article>
    </section>

    <section class="detail-card wide-card">
      <div class="detail-card-head">
        <div>
          <p class="eyebrow">HISTORY</p>
          <h2>온라인 진단 기록</h2>
        </div>
        <span id="diagnosisHistoryCount" class="count-pill">0</span>
      </div>
      <div id="diagnosisHistory" class="history-list"></div>
    </section>

    <section class="detail-grid">
      <article class="detail-card">
        <div class="detail-card-head">
          <div>
            <p class="eyebrow">CARE VISITS</p>
            <h2>방문 케어 기록</h2>
          </div>
          <span id="visitHistoryCount" class="count-pill">0</span>
        </div>
        <div id="visitHistory" class="history-list compact-history"></div>
      </article>

      <article class="detail-card">
        <div class="detail-card-head">
          <div>
            <p class="eyebrow">CARE REPORTS</p>
            <h2>Care Report</h2>
          </div>
          <span id="reportHistoryCount" class="count-pill">0</span>
        </div>
        <div id="reportHistory" class="history-list compact-history"></div>
      </article>
    </section>

    <p id="detailMessage" class="dashboard-message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/admin-customer-detail.js"></script>
</body>
</html>
